[project]
name = "tfm3lab"
version = "0.1.0"
description = "TimesFM-3 experiments — Magic: The Gathering, market shocks, calibration, covariates"
readme = "README.md"
authors = [
    { name = "Irfan Cela", email = "irfeazy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.5.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "py7zr>=1.1.3",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "timesfm[torch]>=3.0.0",
    "tqdm>=4.70.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.4.0",
]
cuda = [
    "torch>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfm3lab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.uv]
# CPU and CUDA torch builds are mutually exclusive — pick one per machine:
#   local (no GPU):  uv sync --extra cpu
#   Colab (GPU):      uv sync --extra cuda
# Never `uv pip install torch` — that bypasses this index selection entirely.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
# TimesFM-3 pretrained weights are gated on Hugging Face under a
# non-commercial / non-production license (timesfm-non-commercial-license-v1.0).
# Accept the terms on huggingface.co/google/timesfm-3.0-pytorch and run
# `hf auth login` once before the first download — see README.md.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/tfm3lab"]
